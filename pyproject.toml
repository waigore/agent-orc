[project]
name = "agent-orc"
version = "0.1.0"
description = "Independent orchestrator: run cursor/grok/opencode skill agents against a target project's .orc config"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.80.0",
    "pyyaml>=6.0",
    "questionary>=2.0",
]

[project.scripts]
agent-orc = "agent_orc.cli:main"

[project.urls]
Homepage = "https://github.com/waigore/agent-orc"
Repository = "https://github.com/waigore/agent-orc"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_orc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: real GitHub + real agent CLIs; run after unit/integration",
]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.coverage.run]
source = ["agent_orc"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", ".github/scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = true
